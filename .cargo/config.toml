[alias]
stacks-node = "run --package stacks-node --"
fmt-stacks = "fmt -- --config group_imports=StdExternalCrate,imports_granularity=Module"
# Selects workspace members by exclusion: `sbtc` brings a second copy of
# `clarity`, `clarity-types` and `stacks-common`, so `-p clarity` and friends are
# ambiguous alongside packages that depend on `stackslib` (see
# `stackslib::chainstate::stacks::sbtc`).
clippy-stacks = "clippy --workspace --exclude stackslib --exclude stacks-marf --exclude stacks-node --no-deps --all-targets --all-features -- -D warnings"
clippy-stackslib = "clippy -p stackslib --no-deps -- -Aclippy::all -Wclippy::indexing_slicing -Wclippy::nonminimal_bool -Wclippy::clone_on_copy"

# Uncomment to improve performance slightly, at the cost of portability
#   * Note that native binaries may not run on CPUs that are different from the build machine
# [build]
# rustflags = ["-Ctarget-cpu=native"]

